<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уход за растениями - Flower Lover</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #000; background: #fff; }
        a { color: #000; text-decoration: none; }
        ul { list-style: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        header { background: #fff; border-bottom: 1px solid #ccc; position: sticky; top: 0; }
        .header-inner { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .logo { display: flex; align-items: center; gap: 10px; }
        .logo span { font-weight: bold; font-size: 24px; }
        nav ul { display: flex; gap: 30px; }
        nav ul a { font-weight: 500; }
        nav ul a.active { text-decoration: underline; }
        .header-actions { display: flex; align-items: center; gap: 20px; }
        .cart-count { background: #000; color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; position: relative; }
        .cart-count::after { content: attr(data-count); position: absolute; top: -8px; right: -8px; }
        footer { background: #000; color: #fff; padding: 40px 0 20px; }
        .footer-content { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; margin-bottom: 30px; }
        footer h3 { margin-bottom: 20px; }
        footer ul li { margin-bottom: 10px; }
        .footer-bottom { text-align: center; padding-top: 20px; border-top: 1px solid #555; }
        .breadcrumb { padding: 20px 0; border-bottom: 1px solid #ccc; }
        .breadcrumb-inner { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .breadcrumb a { text-decoration: underline; }
        .breadcrumb span { color: #666; margin: 0 10px; }
        .btn { display: inline-block; padding: 15px 40px; background: #000; color: #fff; border-radius: 30px; font-weight: 600; cursor: pointer; border: none; }
        .btn:hover { background: #333; }
        .mobile-menu-btn { display: none; background: none; border: none; cursor: pointer; }
        @media (max-width: 768px) {
            nav ul { display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; flex-direction: column; padding: 20px; border-top: 1px solid #ccc; }
            nav ul.active { display: flex; }
            .mobile-menu-btn { display: block; }
        }
        .care { padding: 40px 0; }
        .care h1 { font-size: 32px; margin-bottom: 30px; }
        .care-tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; }
        .care-tip { border: 1px solid #ddd; padding: 20px; }
        .care-tip h3 { font-size: 20px; margin-bottom: 15px; color: #000; }
        .care-tip p { color: #333; line-height: 1.8; }
    </style>
</head>

            </div>
        </div>
    </header>

    <main>

        <div class="breadcrumb">
            <div class="breadcrumb-inner">
                <a href="index.html">Главная</a>

                <span>Уход за растениями</span>

        <section class="care">
